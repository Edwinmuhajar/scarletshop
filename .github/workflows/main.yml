name: Build ScarletShopCore

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Susun struktur Maven (jika file masih di root)
        run: |
          if [ ! -d src/main/java ]; then
            mkdir -p src/main/java/com/example/scarletshopcore src/main/resources
            mv ./*.java src/main/java/com/example/scarletshopcore/
            mv plugin.yml config.yml shop.yml src/main/resources/
          fi
          find src -type f

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build dengan Maven
        run: mvn -B -ntp clean package

      - name: Cek isi jar (gagal jika kosong)
        run: |
          LIST=$(unzip -l target/ScarletShopCore-*.jar)
          echo "$LIST"
          grep -q "plugin.yml" <<< "$LIST"
          grep -q "ScarletShopCore.class" <<< "$LIST"

      - name: Upload jar sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScarletShopCore
          path: target/ScarletShopCore-*.jar
          if-no-files-found: error

      - name: Buat Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ScarletShopCore-*.jar
        
